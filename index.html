<html lang="id">
<head>
<link rel="icon" type="image/png" href="favicon-32.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>Marvel Watch Order</title>
<style>
  :root{
    --bg: #08080c;
    --panel: #121218;
    --ink: #f5f3ec;
    --ink-dim: #a9a6b8;
    --line: #26262f;
  }
  *{box-sizing:border-box;}
  html,body{ margin:0; background:var(--bg); }
  body{ -webkit-tap-highlight-color: transparent; }
  #mc-root{
    background:var(--bg);
    color:var(--ink);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 26px 16px 56px;
    border-radius: 14px;
    max-width: 780px;
    margin: 0 auto;
  }
  .mc-hero{ text-align:center; padding: 6px 8px 20px; }
  .mc-hero h1{
    font-size: 26px;
    margin: 0;
    font-weight: 900;
    letter-spacing: 0.3px;
    color: var(--ink);
  }

  .mc-ring-wrap{
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 14px;
    margin: 18px 0 22px;
    padding: 14px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    flex-wrap: wrap;
  }
  .mc-ring{ position:relative; width:56px; height:56px; flex:none; }
  .mc-ring svg{ transform: rotate(-90deg); }
  .mc-ring circle{ fill:none; stroke-width: 6; }
  .mc-ring .mc-ring-bg{ stroke:#26262f; }
  .mc-ring .mc-ring-fg{ stroke: url(#mc-grad); stroke-linecap: round; transition: stroke-dashoffset .35s ease; }
  .mc-ring-label{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size: 11px; font-weight:800; color: var(--ink);
  }
  .mc-ring-text{ font-size: 13px; color: var(--ink-dim); text-align:center; }
  .mc-ring-text b{ color: var(--ink); font-size: 15px; }

  .mc-panel{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 18px;
  }

  .mc-search{ position: relative; margin-bottom: 12px; }
  .mc-search svg{
    position:absolute; left:12px; top:50%; transform:translateY(-50%);
    width:15px; height:15px; opacity:0.5; pointer-events:none;
  }
  .mc-search input{
    width:100%;
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--ink);
    font-size: 16px;
    padding: 11px 34px 11px 34px;
    border-radius: 10px;
    outline: none;
    transition: border-color .15s ease;
  }
  .mc-search input::placeholder{ color: #6f6c7c; }
  .mc-search input:focus{ border-color: var(--ink-dim); }
  .mc-search-clear{
    position:absolute; right:8px; top:50%; transform:translateY(-50%);
    width:22px; height:22px; border:none; background:transparent;
    color: var(--ink-dim); font-size:16px; line-height:1; cursor:pointer;
    display:none; align-items:center; justify-content:center; border-radius:50%;
  }
  .mc-search-clear:hover{ color: var(--ink); background: rgba(255,255,255,0.08); }
  .mc-search-clear.show{ display:flex; }

  .mc-controls-row{
    display:flex;
    gap: 10px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .mc-control{ flex: 1; min-width: 150px; }
  .mc-control label{
    display:block; color: var(--ink-dim); font-size: 10.5px; font-weight:800;
    text-transform: uppercase; letter-spacing:0.4px; margin-bottom: 5px;
  }
  .mc-control select{
    width:100%;
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--ink);
    font-size: 15px;
    font-weight: 600;
    padding: 10px 10px;
    border-radius: 9px;
    cursor: pointer;
  }

  .mc-filters{
    display:flex;
    gap: 7px;
    flex-wrap: wrap;
  }
  .mc-chip{
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--ink-dim);
    font-size: 12px;
    font-weight: 700;
    padding: 6px 13px;
    border-radius: 20px;
    cursor: pointer;
    transition: all .15s ease;
  }
  .mc-chip.active{ background: var(--ink); color:#0c0c10; border-color: var(--ink); }
  .mc-chip:hover:not(.active){ border-color: var(--ink-dim); color: var(--ink); }

  .mc-result-count{
    color: var(--ink-dim); font-size: 11.5px; margin: 2px 2px 12px;
  }
  .mc-empty{
    text-align:center; color: var(--ink-dim); font-size: 13px;
    padding: 30px 10px; border: 1px dashed var(--line); border-radius: 12px;
  }

  .mc-list{ display:flex; flex-direction:column; gap: 10px; }

  .mc-item{
    display:flex;
    align-items:center;
    gap: 12px;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.08);
    position: relative;
    overflow: hidden;
    transition: opacity .2s ease, transform .15s ease;
  }
  .mc-item.hidden{ display:none; }
  .mc-item::before{
    content:"";
    position:absolute; inset:0;
    background: var(--item-bg);
    opacity: 0.9;
    z-index:0;
  }
  .mc-item::after{
    content:"";
    position:absolute; inset:0;
    background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.35) 100%);
    z-index:0;
  }
  .mc-item.done{ opacity: 0.42; }

  .mc-check-btn{
    position:relative; z-index:1;
    width: 30px; height:30px;
    flex: none;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.75);
    background: rgba(0,0,0,0.15);
    cursor: pointer;
    display:flex; align-items:center; justify-content:center;
    padding:0;
    transition: transform .18s cubic-bezier(.34,1.56,.64,1), background .15s ease;
  }
  .mc-check-btn.checked{
    background: #fff;
    transform: scale(1.12);
  }
  .mc-check-btn.checked::after{
    content:"✓";
    font-size: 15px;
    font-weight: 900;
    color: #111;
  }

  .mc-item-body{ position:relative; z-index:1; flex: 1; min-width:0; }
  .mc-item-title-row{ display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
  .mc-item-title{
    font-size: 15px;
    font-weight: 800;
    color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,0.5);
  }
  .mc-item.done .mc-item-title{ text-decoration: line-through; }
  a.mc-item-title{ text-decoration: none; cursor: pointer; }
  a.mc-item-title:hover, a.mc-item-title:focus{ text-decoration: underline; }
  .mc-item.done a.mc-item-title{ text-decoration: line-through; }
  .mc-item-meta{
    font-size: 11.5px;
    color: rgba(255,255,255,0.85);
    margin-top: 2px;
    text-shadow: 0 1px 3px rgba(0,0,0,0.5);
  }
  .mc-item-note{
    font-size: 10.5px;
    color: rgba(255,255,255,0.75);
    margin-top: 3px;
    font-style: italic;
  }
  .mc-badge{
    font-size: 9px;
    font-weight: 900;
    letter-spacing: 0.4px;
    padding: 2px 7px;
    border-radius: 5px;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .mc-badge.nonmcu{ background: rgba(0,0,0,0.55); color: #fff; border: 1px solid rgba(255,255,255,0.5); }
  .mc-badge.tvseries{ background: rgba(255,255,255,0.16); color: #fff; border: 1px solid rgba(255,255,255,0.55); }
  .mc-badge.upcoming{ background: rgba(255,255,255,0.92); color: #111; }
  .mc-badge.animation{ background: rgba(14,165,233,0.28); color: #fff; border: 1px solid rgba(14,165,233,0.7); }

  .mc-reset{
    display:block;
    margin: 16px auto 0;
    background: transparent;
    border: 1px solid var(--line);
    color: var(--ink-dim);
    font-size: 12px;
    padding: 7px 14px;
    border-radius: 8px;
    cursor: pointer;
  }
  .mc-reset:hover{ border-color: var(--ink-dim); color: var(--ink); }

  .mc-done-toggle{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    width:100%;
    margin-top: 16px;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--ink-dim);
    font-size: 12.5px;
    font-weight: 800;
    padding: 11px 14px;
    border-radius: 10px;
    cursor: pointer;
  }
  .mc-done-toggle:hover{ border-color: var(--ink-dim); color: var(--ink); }
  .mc-done-toggle .mc-chev{ transition: transform .2s ease; font-size: 11px; }
  .mc-done-toggle.open .mc-chev{ transform: rotate(180deg); }
  .mc-list-done{ display:flex; flex-direction:column; gap:10px; margin-top:10px; }
  .mc-list-done.collapsed{ display:none; }

  @keyframes mc-pop{
    0%{ transform: scale(1); }
    40%{ transform: scale(0.97); }
    100%{ transform: scale(1); }
  }
  .mc-item.just-checked{ animation: mc-pop .3s ease; }

  /* ===== Desktop ratio: layout lebih lebar, list 2 kolom ===== */
  @media (min-width: 860px){
    #mc-root{ max-width: 1080px; padding: 34px 28px 64px; }
    .mc-hero h1{ font-size: 32px; }
    .mc-ring-wrap{ padding: 18px 22px; }
    .mc-panel{ padding: 18px 20px; }
    .mc-controls-row{ flex-wrap: nowrap; }
    .mc-list, .mc-list-done{
      display:grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    .mc-item{ padding: 14px 16px; }
  }
  @media (min-width: 1280px){
    #mc-root{ max-width: 1320px; }
    .mc-list, .mc-list-done{ grid-template-columns: repeat(3, 1fr); }
  }

  /* ===== Mobile ratio ===== */
  @media (max-width: 420px){
    #mc-root{ padding: 18px 10px 40px; }
    .mc-hero h1{ font-size: 21px; }
    .mc-item{ padding: 11px 12px; gap: 10px; }
    .mc-item-title{ font-size: 13.5px; }
    .mc-item-meta{ font-size: 10.5px; }
    .mc-item-note{ font-size: 10px; }
    .mc-ring-wrap{ gap:10px; padding:12px; }
    .mc-panel{ padding: 12px; }
    .mc-control{ min-width: 100%; }
    .mc-chip{ padding: 7px 12px; }
    .mc-badge{ font-size: 8.5px; }
  }
</style>
</head>
<body>

<div id="mc-root">
  <div class="mc-hero">
    <h1>Marvel Watch Order</h1>
  </div>

  <div class="mc-ring-wrap">
    <div class="mc-ring">
      <svg width="56" height="56" viewBox="0 0 56 56">
        <defs>
          <linearGradient id="mc-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ff5f5f"/>
            <stop offset="50%" stop-color="#ffd23f"/>
            <stop offset="100%" stop-color="#6fb3ff"/>
          </linearGradient>
        </defs>
        <circle class="mc-ring-bg" cx="28" cy="28" r="23"></circle>
        <circle class="mc-ring-fg" id="mc-ring-fg" cx="28" cy="28" r="23" stroke-dasharray="144.5" stroke-dashoffset="144.5"></circle>
      </svg>
      <div class="mc-ring-label" id="mc-ring-pct">0%</div>
    </div>
    <div class="mc-ring-text">Progress: <b id="mc-count-text">0/0</b> udah ditonton</div>
  </div>

  <div class="mc-panel">
    <div class="mc-search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="search" id="mc-search-input" placeholder="Cari judul film atau serial..." autocomplete="off">
      <button class="mc-search-clear" id="mc-search-clear" aria-label="Hapus pencarian">×</button>
    </div>

    <div class="mc-controls-row">
      <div class="mc-control">
        <label for="mc-sort">Urutkan</label>
        <select id="mc-sort">
          <option value="default">Urutan rilis</option>
          <option value="az">Judul (A-Z)</option>
          <option value="year-desc">Tahun (baru-lama)</option>
          <option value="year-asc">Tahun (lama-baru)</option>
          <option value="rating">Rating (tertinggi)</option>
        </select>
      </div>
      <div class="mc-control">
        <label for="mc-hero-select">Hero</label>
        <select id="mc-hero-select">
          <option value="all">Semua Hero</option>
        </select>
      </div>
    </div>

    <div class="mc-filters">
      <button class="mc-chip active" data-filter="all">Semua</button>
      <button class="mc-chip" data-filter="mcu">MCU</button>
      <button class="mc-chip" data-filter="nonmcu">Non MCU</button>
      <button class="mc-chip" data-filter="tvseries">TV Series</button>
      <button class="mc-chip" data-filter="animation">Animasi</button>
    </div>
  </div>

  <div class="mc-result-count" id="mc-result-count"></div>

  <div class="mc-list" id="mc-list"></div>
  <div class="mc-empty" id="mc-empty" style="display:none;">Gak ada judul yang cocok. Coba kata kunci atau filter lain.</div>

  <button class="mc-done-toggle" id="mc-done-toggle">
    <span id="mc-done-toggle-label">Tampilkan yang sudah ditonton (0)</span>
    <span class="mc-chev">▾</span>
  </button>
  <div class="mc-list-done collapsed" id="mc-list-done"></div>

  <button class="mc-reset" id="mc-reset-btn">Reset semua centang</button>
</div>

  }

  async function loadState(){
    try{
      if(hasClaudeStorage()){
        const res = await window.storage.get(STORAGE_KEY);
        if(res && res.value) state = JSON.parse(res.value);
      } else {
        const raw = localStorage.getItem(STORAGE_KEY);
        if(raw) state = JSON.parse(raw);
      }
    }catch(e){ state = {}; }
    render();
  }
  async function saveState(){
    try{
      if(hasClaudeStorage()){
        await window.storage.set(STORAGE_KEY, JSON.stringify(state));
      } else {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      }
    }catch(e){}
  }

  const listEl = document.getElementById("mc-list");
  const ringFg = document.getElementById("mc-ring-fg");
  const ringPct = document.getElementById("mc-ring-pct");
  const countText = document.getElementById("mc-count-text");

  function getFilteredIndices(){
    return DATA.map((_, i) => i).filter(i => {
      const entry = DATA[i];
      const f = entry[4] || {};
      const theme = entry[3];
      const title = entry[0].toLowerCase();
      const isNonMcu = !!f.nonmcu;
      const isTv = !!f.tvseries;
      const isAnimation = !!f.animation;

      let show = true;
      if(categoryFilter === "mcu") show = !isNonMcu && !isTv;
      else if(categoryFilter === "nonmcu") show = isNonMcu;
      else if(categoryFilter === "tvseries") show = isTv;
      else if(categoryFilter === "animation") show = isAnimation;

      if(show && heroFilter !== "all") show = theme === heroFilter;
      if(show && searchQuery) show = title.indexOf(searchQuery) !== -1;

      return show;
    });
  }

  function updateProgress(){
    const filteredIdxs = getFilteredIndices();
    const total = filteredIdxs.length;
    let done = 0;
    filteredIdxs.forEach(i => { if(state[i]) done++; });
    const pct = total ? Math.round((done/total)*100) : 0;
    const circumference = 2 * Math.PI * 23;
    const offset = circumference - (pct/100) * circumference;
    ringFg.style.strokeDasharray = circumference.toFixed(1);
    ringFg.style.strokeDashoffset = offset.toFixed(1);
    ringPct.textContent = pct + "%";
    countText.textContent = done + "/" + total;
  }

  const resultCountEl = document.getElementById("mc-result-count");
  const emptyEl = document.getElementById("mc-empty");

  function applyFilter(){
    let visibleCount = 0;
    document.querySelectorAll(".mc-item").forEach(el => {
      const isNonMcu = el.dataset.nonmcu === "1";
      const isTv = el.dataset.tvseries === "1";
      const isAnimation = el.dataset.animation === "1";
      const theme = el.dataset.theme;
      const title = el.dataset.title || "";

      let show = true;
      if(categoryFilter === "mcu") show = !isNonMcu && !isTv;
      else if(categoryFilter === "nonmcu") show = isNonMcu;
      else if(categoryFilter === "tvseries") show = isTv;
      else if(categoryFilter === "animation") show = isAnimation;

      if(show && heroFilter !== "all") show = theme === heroFilter;
      if(show && searchQuery) show = title.indexOf(searchQuery) !== -1;

      el.classList.toggle("hidden", !show);
      if(show) visibleCount++;
    });
    resultCountEl.textContent = visibleCount + " dari " + DATA.length + " judul";
    emptyEl.style.display = visibleCount === 0 ? "block" : "none";
    updateProgress();
  }

  function parseYear(dateStr){
    const parts = dateStr.trim().split(" ");
    return parseInt(parts[parts.length - 1], 10);
  }

  function getSortedIndices(){
    const idxs = DATA.map((_, i) => i);
    if(sortMode === "az"){
      idxs.sort((a, b) => DATA[a][0].localeCompare(DATA[b][0]));
    } else if(sortMode === "year-desc" || sortMode === "year-asc"){
      idxs.sort((a, b) => {
        const ya = parseYear(DATA[a][1]);
        const yb = parseYear(DATA[b][1]);
        return sortMode === "year-desc" ? yb - ya : ya - yb;
      });
    } else if(sortMode === "rating"){
      idxs.sort((a, b) => {
        const ra = (DATA[a][4] && DATA[a][4].rating != null) ? DATA[a][4].rating : -1;
        const rb = (DATA[b][4] && DATA[b][4].rating != null) ? DATA[b][4].rating : -1;
        return rb - ra;
      });
    }
    return idxs;
  }

  function render(){
    listEl.innerHTML = "";
    const idxs = getSortedIndices();
    idxs.forEach(i => {
      const entry = DATA[i];
      const [title, date, studio, theme, flags, link] = entry;
      const f = flags || {};
      const hasLink = typeof link === "string" && link.trim().length > 0;
      const row = document.createElement("div");
      row.className = "mc-item" + (state[i] ? " done" : "");
      row.style.setProperty("--item-bg", THEMES[theme] || THEMES.avengers);
      row.dataset.nonmcu = f.nonmcu ? "1" : "0";
      row.dataset.tvseries = f.tvseries ? "1" : "0";
      row.dataset.animation = f.animation ? "1" : "0";
      row.dataset.theme = theme;
      row.dataset.title = title.toLowerCase();

      row.innerHTML = `
        <button class="mc-check-btn${state[i] ? " checked" : ""}" data-idx="${i}"></button>
        <div class="mc-item-body">
          <div class="mc-item-title-row">
            ${hasLink
              ? `<a class="mc-item-title mc-item-title-link" href="${link}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">${title}</a>`
              : `<span class="mc-item-title">${title}</span>`}
            ${f.nonmcu ? '<span class="mc-badge nonmcu">Non MCU</span>' : ""}
            ${f.tvseries ? '<span class="mc-badge tvseries">TV Series</span>' : ""}
            ${f.animation ? '<span class="mc-badge animation">Animation</span>' : ""}
            ${f.upcoming ? '<span class="mc-badge upcoming">Belum rilis</span>' : ""}
          </div>
          <div class="mc-item-meta">${date} · ${studio}${f.rating != null ? " · ★ " + f.rating.toFixed(1) : ""}</div>
          ${f.note ? `<div class="mc-item-note">${f.note}</div>` : ""}
        </div>
      `;

      const btn = row.querySelector(".mc-check-btn");
      btn.addEventListener("click", () => {
        state[i] = !state[i];
        saveState();
        row.classList.toggle("done", !!state[i]);
        btn.classList.toggle("checked", !!state[i]);
        row.classList.remove("just-checked");
        void row.offsetWidth;
        row.classList.add("just-checked");
        updateProgress();
      });

      listEl.appendChild(row);
    });
    applyFilter();
  }

  // Populate the per-hero <select> dynamically from themes actually used in DATA
  const heroSelectEl = document.getElementById("mc-hero-select");
  const seenThemes = [];
  DATA.forEach(entry => {
    const theme = entry[3];
    if(seenThemes.indexOf(theme) === -1) seenThemes.push(theme);
  });
  seenThemes.forEach(theme => {
    const label = HERO_LABELS[theme];
    if(!label) return;
    const opt = document.createElement("option");
    opt.value = theme;
    opt.textContent = label;
    heroSelectEl.appendChild(opt);
  });

  document.querySelectorAll(".mc-filters .mc-chip").forEach(chip => {
    chip.addEventListener("click", () => {
      document.querySelectorAll(".mc-filters .mc-chip").forEach(c => c.classList.remove("active"));
      chip.classList.add("active");
      categoryFilter = chip.dataset.filter;
      applyFilter();
    });
  });

  heroSelectEl.addEventListener("change", (e) => {
    heroFilter = e.target.value;
    applyFilter();
  });

  document.getElementById("mc-sort").addEventListener("change", (e) => {
    sortMode = e.target.value;
    render();
  });

  const searchInput = document.getElementById("mc-search-input");
  const searchClear = document.getElementById("mc-search-clear");
  searchInput.addEventListener("input", (e) => {
    searchQuery = e.target.value.trim().toLowerCase();
    searchClear.classList.toggle("show", searchQuery.length > 0);
    applyFilter();
  });
  searchClear.addEventListener("click", () => {
    searchInput.value = "";
    searchQuery = "";
    searchClear.classList.remove("show");
    applyFilter();
    searchInput.focus();
  });

  document.getElementById("mc-reset-btn").addEventListener("click", async () => {
    state = {};
    await saveState();
    render();
  });

  loadState();
})();
</script>
</body>
</html>
